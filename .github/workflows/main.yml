name: ITI GOMAA E-COMMERCE UI Automation TESTING WORKFLOW

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests
        run: mvn clean test -DsuiteXmlFile=RegressionTest.xml
        continue-on-error: true

      - name: Install Allure CLI
        run: |
          # Download the correct Allure commandline package from Maven Central
          wget https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.29.1/allure-commandline-2.29.1.zip
          unzip allure-commandline-2.29.1.zip -d /opt/
          echo "/opt/allure-2.29.1/bin" >> $GITHUB_PATH

      - name: Generate Allure Report
        if: always()
        run: |
          # Copy results from test-output/allure-results to root allure-results if they exist
          if [ -d "test-output/allure-results" ]; then
            mkdir -p allure-results
            cp -r test-output/allure-results/* allure-results/ 2>/dev/null || true
          fi
          # Generate report using the root allure-results directory
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to GitHub Page
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages