# FluentWait timeout (in seconds)
# Used by: WaitHandler.java
DEFAULT_WAIT=15

# FluentWait polling interval (in milliseconds)
# How often to check for conditions during waits
# Used by: WaitHandler.java
POLLING_INTERVAL=100

# WebDriver Timeouts (in seconds)
# Used by: ChromeFactory.java, EdgeFactory.java, FireFoxFactory.java
# These are automatically read and applied when driver is created

# Page Load Timeout - Maximum time to wait for a page to load
PAGE_LOAD_TIMEOUT=15

# Script Timeout - Maximum time to wait for JavaScript execution
SCRIPT_TIMEOUT=15

# Implicit Wait - Default wait time for element finding
IMPLICIT_WAIT=10

# NOTE: TestNG test-level timeouts CANNOT be configured here
# TestNG @Test annotation parameters must be compile-time constants
# To configure test timeouts, edit testng.xml file